syntax = "proto3";

option csharp_namespace = "Grpc";

package users;

service UserRpcService {
  rpc GetItems (UserRpcQuery) returns (UserRpcResponse);
  rpc GetOrCreate (UserGetOrCreateRequest) returns (UserGetOrCreateResponse);
  rpc AdminLogin (AdminLoginRequest) returns (AdminLoginResponse);
  rpc SetTotpSecret (SetTotpSecretRequest) returns (SetTotpSecretResponse);
  rpc SetPassword (SetPasswordRequest) returns (SetPasswordResponse);
}

message UserRpcQuery {
  string id=1;
  bool simple_query=2;
}

message UserGrpcItem {
  string id=1;
  int32 role=2;
}

message UserRpcResponse {
  repeated UserGrpcItem items = 1;
}

message UserGetOrCreateRequest {
  string tg_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
}

message UserGetOrCreateResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  int32 role = 5;
}

// Admin auth messages
message AdminLoginRequest {
  string email = 1;
  string password = 2;
}

message AdminLoginResponse {
  bool success = 1;
  string user_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  int32 role = 6;
  bool totp_configured = 7;
  string totp_secret = 8;
  string error = 9;
}

message SetTotpSecretRequest {
  string user_id = 1;
  string totp_secret = 2;
}

message SetTotpSecretResponse {
  bool success = 1;
}

message SetPasswordRequest {
  string user_id = 1;
  string password_hash = 2;
}

message SetPasswordResponse {
  bool success = 1;
}
