<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img" aria-label="Orca silhouette">
  <!-- Касатка в профиль, плывёт влево. Цвета фиксированные (файл грузится как
       background-image и до CSS-переменных темы не дотягивается): тёмное тело
       и светлые пятна — глазное, седло за плавником и брюхо. -->
  <g>
    <!-- тело со спинным плавником и хвостовыми лопастями -->
    <path fill="#141f2c" d="M 8 56
      C 18 44, 42 35, 72 33
      C 76 22, 81 12, 90 8
      C 91 20, 97 29, 106 33
      C 132 35, 156 42, 170 49
      C 174 44, 179 38, 184 34
      C 186 38, 190 40, 195 40
      C 191 44, 187 49, 185 53
      C 188 57, 192 62, 195 67
      C 190 66, 185 67, 181 70
      C 179 65, 175 59, 170 55
      C 154 63, 128 69, 100 70
      C 62 71, 28 66, 8 56 Z"/>
    <!-- грудной плавник -->
    <path fill="#141f2c" d="M 58 62 C 68 66, 78 76, 76 86 C 66 84, 56 73, 54 64 Z"/>
    <!-- глазное пятно -->
    <path fill="#dfe9f2" opacity=".9" d="M 26 44 C 32 41, 40 41, 45 44 C 40 47, 31 47, 26 44 Z"/>
    <!-- седло за спинным плавником -->
    <path fill="#9fb4c8" opacity=".55" d="M 104 34 C 112 32, 122 33, 128 36 C 120 40, 110 40, 104 37 Z"/>
    <!-- светлое брюхо -->
    <path fill="#dfe9f2" opacity=".55" d="M 12 57 C 30 64, 55 68, 84 69 C 60 72, 32 68, 13 59 Z"/>
  </g>
</svg>
