<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aurora sky">
  <!-- Слой «небо» многослойного параллакса: только небо, аврора, звёзды и луна.
       Сопки и вода — в parallax-hills-far/near.svg, они едут отдельными слоями. -->
  <defs>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070c1a"/>
      <stop offset="0.65" stop-color="#0d1734"/>
      <stop offset="1" stop-color="#132148"/>
    </linearGradient>
    <linearGradient id="pa1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ce8a4" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3ce8a4" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#4cc9f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pa2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b7cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ce8a4" stop-opacity="0"/>
    </linearGradient>
    <filter id="psoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#psky)"/>

  <!-- ленты сияния -->
  <path d="M-50 430 C 300 180, 700 330, 1050 150 C 1300 30, 1650 130, 1970 60 L 1970 320 C 1650 400, 1350 330, 1050 450 C 750 570, 350 520, -50 640 Z"
        fill="url(#pa1)" filter="url(#psoft)" opacity="0.85"/>
  <path d="M-50 560 C 350 400, 800 500, 1200 330 C 1450 230, 1750 280, 1970 220 L 1970 420 C 1700 490, 1450 450, 1150 570 C 850 690, 350 660, -50 760 Z"
        fill="url(#pa2)" filter="url(#psoft)" opacity="0.6"/>

  <!-- звёзды: как в parallax.svg + несколько ниже, где раньше стояли сопки -->
  <g fill="#e9eef8">
    <circle cx="140" cy="130" r="2.2" opacity="0.9"/>
    <circle cx="360" cy="240" r="1.4" opacity="0.6"/>
    <circle cx="560" cy="110" r="1.8" opacity="0.8"/>
    <circle cx="820" cy="200" r="1.3" opacity="0.5"/>
    <circle cx="1030" cy="90" r="2" opacity="0.9"/>
    <circle cx="1260" cy="190" r="1.4" opacity="0.6"/>
    <circle cx="1480" cy="80" r="1.7" opacity="0.7"/>
    <circle cx="1680" cy="210" r="1.3" opacity="0.5"/>
    <circle cx="1840" cy="120" r="2.1" opacity="0.9"/>
    <circle cx="240" cy="330" r="1.3" opacity="0.5"/>
    <circle cx="960" cy="300" r="1.5" opacity="0.6"/>
    <circle cx="1580" cy="330" r="1.4" opacity="0.55"/>
    <circle cx="420" cy="520" r="1.3" opacity="0.45"/>
    <circle cx="760" cy="640" r="1.2" opacity="0.4"/>
    <circle cx="1160" cy="560" r="1.4" opacity="0.45"/>
    <circle cx="1720" cy="620" r="1.2" opacity="0.4"/>
    <circle cx="180" cy="760" r="1.3" opacity="0.35"/>
    <circle cx="1420" cy="800" r="1.2" opacity="0.35"/>
  </g>

  <!-- луна -->
  <circle cx="1610" cy="170" r="46" fill="#dbe7f7" opacity="0.92"/>
  <circle cx="1596" cy="158" r="10" fill="#c3d3ea" opacity="0.8"/>
  <circle cx="1624" cy="186" r="7" fill="#c3d3ea" opacity="0.7"/>
</svg>
