<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Arctic landscape placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1229"/>
      <stop offset="0.7" stop-color="#101b3a"/>
      <stop offset="1" stop-color="#152245"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ce8a4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3ce8a4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b7cf6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3ce8a4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1c38"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- северное сияние -->
  <path d="M60 210 C 180 90, 340 150, 470 70 C 560 20, 680 60, 750 30 L 750 150 C 640 190, 520 160, 420 220 C 320 280, 180 250, 60 300 Z"
        fill="url(#aurora1)" filter="url(#soft)" opacity="0.8"/>
  <path d="M120 260 C 260 170, 420 220, 560 140 C 630 100, 710 120, 760 100 L 760 190 C 660 230, 560 210, 460 260 C 360 310, 220 300, 120 340 Z"
        fill="url(#aurora2)" filter="url(#soft)" opacity="0.65"/>

  <!-- звёзды -->
  <g fill="#e9eef8">
    <circle cx="90" cy="70" r="1.6" opacity="0.9"/>
    <circle cx="160" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="250" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="330" cy="110" r="1" opacity="0.5"/>
    <circle cx="420" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="520" cy="90" r="1.1" opacity="0.6"/>
    <circle cx="600" cy="50" r="1.3" opacity="0.7"/>
    <circle cx="680" cy="110" r="1" opacity="0.5"/>
    <circle cx="740" cy="70" r="1.6" opacity="0.9"/>
    <circle cx="60" cy="160" r="1" opacity="0.5"/>
    <circle cx="710" cy="170" r="1.2" opacity="0.6"/>
  </g>

  <!-- луна -->
  <circle cx="660" cy="90" r="26" fill="#dbe7f7" opacity="0.9"/>
  <circle cx="652" cy="84" r="6" fill="#c3d3ea" opacity="0.8"/>
  <circle cx="668" cy="98" r="4" fill="#c3d3ea" opacity="0.7"/>

  <!-- сопки -->
  <path d="M0 340 L 140 250 L 260 330 L 380 240 L 520 350 L 640 270 L 800 360 L 800 500 L 0 500 Z"
        fill="#131f3d"/>
  <path d="M0 390 L 180 310 L 320 380 L 480 300 L 620 390 L 800 320 L 800 500 L 0 500 Z"
        fill="#0d1730"/>

  <!-- море -->
  <rect y="420" width="800" height="80" fill="url(#sea)"/>
  <g stroke="#3ce8a4" stroke-width="1.4" opacity="0.35">
    <line x1="120" y1="446" x2="220" y2="446"/>
    <line x1="320" y1="466" x2="450" y2="466"/>
    <line x1="540" y1="440" x2="660" y2="440"/>
    <line x1="200" y1="482" x2="330" y2="482"/>
  </g>
</svg>
