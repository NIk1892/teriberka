<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 560" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- Слой «дальняя гряда» многослойного параллакса (тёмная тема).
       Верх прозрачный — сквозь него видно фиксированное небо parallax-sky.svg.
       Силуэт — плавные обкатанные сопки (кривые Безье, не треугольники).
       Заливка тянется до нижнего края с запасом: слой ездит по вертикали
       (±--parallax-shift в app.css), краёв оголять нельзя.
       Светлее ближней гряды — атмосферная перспектива. -->
  <path d="M0 400 C 90 385 170 330 300 265 C 400 215 480 175 590 168 C 690 162 760 205 850 250 C 930 290 1010 305 1110 285 C 1210 265 1260 195 1370 165 C 1450 143 1530 152 1620 200 C 1710 248 1800 330 1920 375 L 1920 560 L 0 560 Z"
        fill="#2a3a66"/>
  <!-- тонкая аврора-подсветка гребня — отделяет гряду от неба -->
  <path d="M0 400 C 90 385 170 330 300 265 C 400 215 480 175 590 168 C 690 162 760 205 850 250 C 930 290 1010 305 1110 285 C 1210 265 1260 195 1370 165 C 1450 143 1530 152 1620 200 C 1710 248 1800 330 1920 375"
