<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Polar day over the Arctic hills">
  <!-- Дневная версия параллакс-пейзажа для светлой темы: полярный день,
       низкое солнце, снежные сопки, светлое море. -->
  <defs>
    <linearGradient id="lsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafc"/>
      <stop offset="0.65" stop-color="#eaf3fd"/>
      <stop offset="1" stop-color="#f6fafe"/>
    </linearGradient>
    <linearGradient id="lglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0aa678" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fd8c0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fd0f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ddf2"/>
      <stop offset="1" stop-color="#b3cfe9"/>
    </linearGradient>
    <filter id="lsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#lsky)"/>

  <!-- лёгкое северное свечение даже днём -->
  <path d="M-50 430 C 300 180, 700 330, 1050 150 C 1300 30, 1650 130, 1970 60 L 1970 320 C 1650 400, 1350 330, 1050 450 C 750 570, 350 520, -50 640 Z"
        fill="url(#lglow)" filter="url(#lsoft)" opacity="0.7"/>

  <!-- низкое солнце -->
  <circle cx="1610" cy="190" r="52" fill="#ffe9b0" opacity="0.95"/>
  <circle cx="1610" cy="190" r="86" fill="#ffe9b0" opacity="0.35" filter="url(#lsoft)"/>

  <!-- снежные сопки -->
  <path d="M0 760 L 320 560 L 620 730 L 940 540 L 1280 770 L 1580 620 L 1920 780 L 1920 1080 L 0 1080 Z"
        fill="#dde9f6"/>
  <path d="M0 870 L 420 700 L 780 850 L 1160 680 L 1520 870 L 1920 730 L 1920 1080 L 0 1080 Z"
        fill="#cfdff0"/>

  <!-- скелет кита на берегу — пасхалка, как в тёмной версии -->
  <g transform="translate(1310 868) scale(0.62)" fill="none" stroke="#8ba6c4" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 96 C 4 84, 3 70, 9 57 C 36 41, 74 35, 110 41 C 129 44, 140 51, 144 59" stroke-width="6"/>
    <path d="M 10 96 C 45 105, 88 100, 123 79 C 133 73, 140 66, 144 59" stroke-width="6"/>
    <path d="M 148 66 C 215 88, 305 89, 420 58" stroke-width="10" stroke-dasharray="14 9"/>
    <path d="M 160 70 C 150 42, 158 12, 180 0" stroke-width="5"/>
    <path d="M 196 79 C 187 51, 195 22, 219 8" stroke-width="5"/>
    <path d="M 232 84 C 225 58, 232 32, 254 19" stroke-width="5"/>
    <path d="M 268 86 C 263 63, 269 40, 288 28" stroke-width="5"/>
    <path d="M 304 85 C 300 66, 306 46, 322 36" stroke-width="5"/>
    <path d="M 340 81 C 338 65, 343 49, 356 41" stroke-width="5"/>
    <path d="M 374 75 C 373 63, 377 51, 386 45" stroke-width="5"/>
  </g>

  <!-- море -->
  <rect y="950" width="1920" height="130" fill="url(#lsea)"/>
  <g stroke="#8fb6d8" stroke-width="2" opacity="0.5">
    <line x1="280" y1="1000" x2="520" y2="1000"/>
    <line x1="760" y1="1035" x2="1050" y2="1035"/>
    <line x1="1300" y1="990" x2="1560" y2="990"/>
    <line x1="520" y1="1060" x2="800" y2="1060"/>
  </g>
</svg>
