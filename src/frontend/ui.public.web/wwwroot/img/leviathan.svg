<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Whale skeleton silhouette">
  <!-- Скелет кита («Левиафан», Териберка) силуэтом: цельный череп, массивные дуги
       рёбер, цепочка позвонков. Прозрачность зашита в группу — файл кладётся фоном. -->
  <g opacity=".16" fill="#8fa9c7" stroke="#8fa9c7" stroke-linecap="round">

    <!-- череп: цельная «ладья» носом влево -->
    <path stroke="none" d="M 38 208
      C 16 178, 20 140, 46 116
      C 104 80, 196 68, 268 86
      C 306 96, 328 118, 330 142
      C 331 158, 320 172, 300 181
      C 236 210, 116 226, 38 208 Z"/>

    <!-- лопатка -->
    <ellipse stroke="none" cx="372" cy="196" rx="34" ry="19" transform="rotate(-22 372 196)"/>

    <!-- позвоночник: жирный пунктир — цепочка позвонков -->
    <path fill="none" stroke-width="21" stroke-dasharray="25 15"
          d="M 344 164 C 480 208, 650 208, 880 142"/>

    <!-- рёбра: массивные дуги, убывают к хвосту -->
    <g fill="none" stroke-width="13">
      <path d="M 376 168 C 358 118, 372 64, 412 38"/>
      <path d="M 424 184 C 408 132, 424 78, 468 50"/>
      <path d="M 472 194 C 458 146, 474 94, 518 68"/>
      <path d="M 520 199 C 510 156, 524 110, 564 86"/>
      <path d="M 568 201 C 560 164, 574 124, 608 102"/>
      <path d="M 616 199 C 610 168, 622 134, 650 116"/>
      <path d="M 664 194 C 660 168, 670 140, 694 126"/>
      <path d="M 712 186 C 710 164, 718 142, 736 130"/>
      <path d="M 758 175 C 757 158, 763 140, 776 131"/>
    </g>
  </g>
</svg>
